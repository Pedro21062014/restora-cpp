name: Build C++ Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-64:
    name: Build Windows 64-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release

      - name: Rename executable
        run: |
          copy build\Release\restora.exe Restora.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-64bit
          path: Restora.exe

  build-windows-32:
    name: Build Windows 32-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A Win32
          cmake --build . --config Release

      - name: Rename executable
        run: |
          copy build\Release\restora.exe Restora-x86.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-32bit
          path: Restora-x86.exe

  build-ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: build/restora

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/restora

  create-release:
    name: Create Release
    needs: [build-windows-64, build-windows-32, build-ubuntu, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all downloaded files
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          name: 'Restora C++ ${{ github.ref_name }}'
          body: |
            ## 🔄 Restora C++ ${{ github.ref_name }} - Native File Recovery Tool

            ###  Downloads

            | Plataforma | Arquivo |
            |------------|---------|
            | ️ Windows 64-bit | `Restora.exe` |
            | ️ Windows 32-bit | `Restora-x86.exe` |

            ### ✨ Recursos
            - 🔍 Scan rápido e profundo
            - 🖼️ Recuperação de imagens, vídeos, áudios, documentos
            - 🔧 Reparo automático de arquivos danificados
            - 🖼️ Filtro de thumbnails
            - 💻 Funciona com apenas 2GB de RAM
            - ️ Suporte a 32-bit Windows para PCs antigos
            -  Código nativo C++, sem frameworks
            -  Interface console simples e direta

            ###  Instalação
            - **Windows**: Baixe o `.exe` e execute diretamente
            - **Windows 7/8**: Instale Visual C++ Redistributable se necessário
