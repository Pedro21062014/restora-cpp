name: Build C++ Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-64:
    name: Build Windows 64-bit
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
          update: true

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles"
          mingw32-make

      - name: Rename executable
        run: |
          cp build/restora.exe Restora.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-64bit
          path: Restora.exe

  build-windows-32:
    name: Build Windows 32-bit
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
          update: true

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles"
          mingw32-make

      - name: Rename executable
        run: |
          cp build/restora.exe Restora-x86.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-32bit
          path: Restora-x86.exe
